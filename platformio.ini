; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanofoc_d
include_dir = include

[env:nanofoc_d]
platform = espressif32@6.5.0
board = nanofoc_d
framework = arduino
board_build.filesystem = littlefs
; Enable external SPI RAM. The board sets -DBOARD_HAS_PSRAM but never declared a
; memory_type, so esp_psram_init() never configured the bus and ps_malloc()
; returned NULL — leaving image decode stuck in the 48 KB internal pool (GIF +
; PNG sprites both OOM'd). qio_qspi = QIO flash + Quad PSRAM (N4R2, the common
; 4 MB-flash part). If the chip is octal, switch to qio_opi.
board_build.arduino.memory_type = qio_qspi
lib_archive = false
lib_deps = 
	fastled/FastLED@3.6.0
	bxparks/AceButton@^1.10.1
	fortyseveneffects/MIDI Library@^5.0.2
	lvgl/lvgl@9.0.0
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.0.2
	adafruit/Adafruit TinyUSB Library@3.1.0
	askuric/Simple FOC @ 2.3.3
	simplefoc/SimpleFOCDrivers @ 1.0.7
	Wire
	sparkfun/SparkFun STUSB4500	@ ^1.1.5
build_flags =
	-DNANO_FIRMWARE_VERSION=\"1.1.0\"
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
	-DUSE_TINYUSB=1
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_USE_TFT_ESPI=1
	-Iinclude
	-DUSER_SETUP_LOADED=1
	-DGC9A01_DRIVER=1
	-DTFT_MOSI=4
	-DTFT_MISO=-1
	-DTFT_SCLK=3
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=2
	-DTFT_BL=-1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DSPI_FREQUENCY=80000000
	-DUSB_MANUFACTURER="\"Binaris Circuitry\""
	-DUSB_PRODUCT="\"Nano_D++ (Beta)\""
	; USB identity — VID is Adafruit's; swap for your own USB-IF VID/PID before mass production.
	-DUSB_VID=0x239A
	-DUSB_PID=0x8010
	; -DAUDIO_FILES_STEREO=1
	; -DUSE_AUDIO_LIB=1
	; -DAUDIO_EN=1

monitor_speed = 115200
monitor_filters =
	send_on_enter
	esp32_exception_decoder
monitor_eol = LF

; ----------------------------------------------------------------------------
; Optional build envs. The default `nanofoc_d` env is the guaranteed-safe core
; (all bug fixes + PD + sprites + brick-proofing). The envs below add features
; that increase flash/RAM use — build & flash them explicitly when wanted.
; On this 4MB board each OTA app slot is 1.3MB; check the build size report.
; ----------------------------------------------------------------------------

; WiFi station auto-connect + ArduinoOTA + raw-TCP JSON transport (port 3333).
; No extra lib_deps: WiFi/WiFiServer/ArduinoOTA are all in the arduino-esp32 core.
[env:nanofoc_d_wifi]
extends = env:nanofoc_d
build_flags =
	${env:nanofoc_d.build_flags}
	-DWIFI_ENABLED
	-DWIFI_OTA_PASSWORD=\"nanod-ota\"

; I2S audio-haptic feedback (clicks / UI cues). Needs the I2S amp populated.
[env:nanofoc_d_audio]
extends = env:nanofoc_d
build_flags =
	${env:nanofoc_d.build_flags}
	-DNANO_AUDIO=1
	-DAUDIO_EN

; Everything on (WiFi + audio). NOTE: overflows the 1.3 MB OTA app slot by ~1.4 KB on this
; 4 MB board (Flash 100.1%). Use _wifi OR _audio, or move to 8 MB flash. See docs/KNOWN_RESIDUALS.md
[env:nanofoc_d_full]
extends = env:nanofoc_d
build_flags =
	${env:nanofoc_d.build_flags}
	-DWIFI_ENABLED
	-DWIFI_OTA_PASSWORD=\"nanod-ota\"
	-DNANO_AUDIO=1
	-DAUDIO_EN

; ----------------------------------------------------------------------------
; Native (host) test environment — runs on the build machine, no hardware needed.
;
; Constraints:
;   - src/ is NOT compiled (test_build_src = no).  Test TUs include only the
;     host-safe header-only files from include/ — no Arduino/FreeRTOS/LittleFS.
;   - Each test_<name>/ directory is a self-contained translation unit with its
;     own main() (UNITY_BEGIN / RUN_TEST / UNITY_END).
;
; Run: pio test -e native
; ----------------------------------------------------------------------------
[env:native]
platform          = native
test_framework    = unity
test_build_src    = no
build_flags       =
	-std=c++14
	-Wall
	-Wextra
	-I include
